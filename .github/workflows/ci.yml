name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mpi
          POSTGRES_PASSWORD: mpi
          POSTGRES_DB: mpi_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mpi" --health-interval 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check . && ruff format --check .
      - run: pytest -q
        env:
          MPI_DATABASE_URL: postgresql+psycopg://mpi:mpi@localhost:5432/mpi_test

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - uses: actions/upload-artifact@v4
        with:
          name: web-static
          path: web/out

  desktop-windows:
    # Builds the Windows installer (NSIS + MSI). Signing uses the certificate configured
    # in repository secrets; unsigned builds are for internal testing only.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: web
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
        working-directory: web
      - run: npm install
        working-directory: desktop
      - run: npx tauri build
        working-directory: desktop
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.PRODUCTION_API_URL || 'http://localhost:8000' }}
          NEXT_TELEMETRY_DISABLED: "1"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/msi/*.msi
